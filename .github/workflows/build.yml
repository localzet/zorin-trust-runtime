name: build
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld zip openjdk-21-jdk python3-cryptography
      - run: ./scripts/build-all.sh
      - name: Assert tiny lifecycle DEX exists
        run: |
          unzip -l app-native/build/zorin-trust-runtime-v5.0.2.apk | grep -q 'classes.dex'
          test "$(unzip -p app-native/build/zorin-trust-runtime-v5.0.2.apk classes.dex | wc -c)" -lt 4096
      - name: Verify local v2 signature
        run: python3 app-native/tools/apk_v2.py verify app-native/build/zorin-trust-runtime-v5.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zorin-trust-runtime-v5.0.2-local-debug
          path: |
            app-native/build/zorin-trust-runtime-v5.0.2.apk
            bridge/build/zorin-adb-core-*
